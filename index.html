<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angel AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;height:100dvh;display:flex;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;background:#000}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #111}
.top b{font-size:17px;font-weight:600}
.login{background:#fff;color:#000;border:0;padding:7px 18px;border-radius:20px;font-weight:600}
.chat{flex:1;overflow-y:auto;padding:18px 12px 120px;display:flex;justify-content:center}
.inner{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh}
.welcome h1{font-size:30px;font-weight:400}
.row{display:flex;width:100%}.user{justify-content:flex-end}
.ubub{background:#2a4a7a;padding:11px 18px;border-radius:22px;max-width:75%;font-size:15px}
.bbub{font-size:15.5px;line-height:1.6;white-space:pre-wrap}
.bbub img{width:100%;max-width:360px;border-radius:14px;margin-top:10px;display:block}
.input-wrap{position:fixed;bottom:0;left:0;right:0;background:#000;padding:12px;display:flex;justify-content:center}
.box{width:100%;max-width:720px;background:#212121;border-radius:28px;display:flex;align-items:center;padding:6px 8px 6px 14px;gap:8px;border:1px solid #2a2a2a}
.box input{background:transparent;border:0;color:#fff;flex:1;outline:none;font-size:16px;padding:10px 2px}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send{background:#fff;color:#000}
</style>
</head>
<body>
<div class="main">
<div class="top"><b>Angel AI</b><button class="login">Log in</button></div>
<div class="chat" id="chat"><div class="inner" id="inner"><div class="welcome" id="wel"><h1>Where should we start?</h1></div></div></div>
<div class="input-wrap"><div class="box"><div class="ic">＋</div><input id="inp" placeholder="Ask Angel AI" onkeydown="if(event.key==='Enter')send()"><div class="ic">🎤</div><div class="ic send" onclick="send()">↑</div></div></div>
</div>
<script>
const inner=document.getElementById('inner'),inp=document.getElementById('inp'),wel=document.getElementById('wel');
function add(user,text,img){
  if(wel)wel.style.display='none';
  let r=document.createElement('div');r.className='row '+(user?'user':'bot');
  if(user){r.innerHTML=`<div class="ubub">${text}</div>`}
  else{
    let im=img?`<img src="${img}" onload="chat.scrollTop=99999">`:'';
    r.innerHTML=`<div class="bbub">${text}${im}</div>`;
  }
  inner.appendChild(r);document.getElementById('chat').scrollTop=999999;
}
async function getSmartReply(t){
  let low=t.toLowerCase();
  // Image
  if(/sad boy|dp|create|photo|picture/i.test(low)){
    let prompt=encodeURIComponent(t.replace(/create|dp|photo/gi,'').trim()+' sad boy aesthetic whatsapp dp 4k');
    let url=`https://image.pollinations.ai/prompt/${prompt}?width=768&height=768&seed=${Math.floor(Math.random()*99999)}&nologo=true`;
    return {text:`Ye lo aapki **${t}** 🥀\n\nPasand aaye to batao, aur style bana dunga!`,img:url};
  }
  // Smart replies
  if(/how are you/.test(low)) return {text:"I'm great! 😊 Thanks for asking. How are you? Kaisay ho aap?"};
  if(/kasay ho|kese ho|kaise ho|kya hal/.test(low)) return {text:"Alhamdulillah, mai bilkul theek hun bhai! 😊 Aap sunao, kasay ho? Kya haal hai?"};
  if(/kaf halak|kaif halak|كيف حالك/.test(low)) return {text:"أنا بخير الحمد لله! 😊 كيف حالك أنت؟\n\nAna bakhair alhamdulillah! Aap kaisay ho?"};
  // Real AI fallback
  try{
    let res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:"You are Angel AI, created by Imtiyaz. Name is Angel AI, NOT ChatGPT. Reply smart, friendly. If user speaks Roman Urdu, reply in Roman Urdu. If Arabic, reply Arabic. If English, English."},{role:'user',content:t}]})});
    let j=await res.json(); return {text:j.choices?.[0]?.message?.content||"Theek hai bhai, samajh gaya! 😊"};
  }catch(e){return {text:"Hi! 👋 How can I help you today?\n\nBolo bhai kya chahiye?"+`\n\nYou said: ${t}`}}
}
async function send(){
  let t=inp.value.trim();if(!t)return; add(true,t); inp.value='';
  let d=document.createElement('div');d.className='row bot';d.innerHTML='<div class="bbub" style="color:#888">Angel is typing...</div>';inner.appendChild(d);
  let ans=await getSmartReply(t); d.remove(); add(false,ans.text,ans.img);
}
</script>
</body>
</html>
