<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Angel AI by Imtiyaz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#ececec;font-family:Inter,sans-serif;height:100dvh;display:flex;overflow:hidden}
.side{width:260px;background:#171717;display:flex;flex-direction:column;flex-shrink:0}
@media(max-width:768px){.side{position:fixed;left:-260px;top:0;height:100dvh;z-index:200;transition:0.3s}.side.open{left:0}}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#212121;flex-shrink:0;border-bottom:1px solid #2f2f2f}
.m-btn{font-size:24px;cursor:pointer}
.model{font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px}
.model b{background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:90px}
.inner{width:100%;max-width:768px;padding:20px 16px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;width:100%}
.row.user{justify-content:flex-end}
.bub{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user .bub{background:#2f2f2f;padding:10px 16px;border-radius:20px;max-width:75%}
.bot .bub{color:#ececec;padding:4px 0}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#a86bff);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.welcome{margin-top:50px;text-align:center;width:100%}
.welcome h1{font-size:26px;font-weight:600;margin-bottom:24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:0 auto;text-align:left}
.card{border:1px solid #333;padding:14px;border-radius:12px;cursor:pointer;background:#1e1e1e}
.card:hover{background:#2f2f2f}
.card b{display:block;font-size:14px}
.card span{color:#888;font-size:12px;margin-top:4px;display:block}
.img{width:100%;max-width:380px;border-radius:12px;margin-top:10px;border:1px solid #333}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{border:1px solid #444;background:#2f2f2f;color:#ececec;padding:6px 12px;border-radius:18px;font-size:13px;cursor:pointer}
.input-wrap{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px;display:flex;justify-content:center;z-index:50;border-top:1px solid #2f2f2f}
@media(min-width:769px){.input-wrap{left:260px}}
.box{width:100%;max-width:768px;background:#2f2f2f;border-radius:26px;display:flex;align-items:center;padding:6px 8px 6px 16px;gap:8px;border:1px solid #444}
.box textarea{background:transparent;border:0;color:#fff;flex:1;outline:none;resize:none;font-size:16px;padding:8px 0;max-height:100px;font-family:inherit}
.send{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;border:0;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;flex-shrink:0}
.hist{flex:1;overflow:auto;padding:10px}
.h-item{padding:10px;border-radius:8px;font-size:13px;color:#aaa;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-item:hover{background:#2f2f2f}
.s-bot{padding:12px;border-top:1px solid #2f2f2f}
.getapp{width:100%;background:#fff;color:#000;border:0;padding:10px;border-radius:20px;font-weight:700;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;display:none}.overlay.show{display:block}
</style>
</head>
<body>
<div class="overlay" id="ov" onclick="toggleSide()"></div>
<div class="side" id="side">
<div style="padding:14px"><button onclick="location.reload()" style="width:100%;background:#2f2f2f;border:0;color:#fff;padding:10px;border-radius:8px;cursor:pointer">＋ New chat</button><div style="padding:12px 4px;font-weight:700;display:flex;gap:8px"><span>👼</span><b style="background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">angel.ai</b><small style="color:#666;font-size:10px">by Imtiyaz</small></div></div>
<div class="hist"><div style="font-size:11px;color:#666;padding:8px">Recent</div><div class="h-item" onclick="q('create sad boy dp')">Create sad boy dp</div><div class="h-item" onclick="q('how are you')">how are you</div><div class="h-item" onclick="q('kasay ho ap')">kasay ho ap</div></div>
<div class="s-bot"><button class="getapp" onclick="alert('Install: Browser ke 3 dots > Add to Home Screen')">⬇ Get App</button></div>
</div>
<div class="main">
<div class="topbar"><div style="display:flex;align-items:center;gap:12px"><span class="m-btn" onclick="toggleSide()">☰</span><span class="model"><b>angel.ai</b> by Imtiyaz</span></div><span style="font-size:18px">⋯</span></div>
<div class="chat" id="chat"><div class="inner" id="inner"></div></div>
<div class="input-wrap"><div class="box"><textarea id="inp" rows="1" placeholder="Message Angel AI..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea><button class="send" onclick="send()">↑</button></div></div>
</div>
<script>
let inner=document.getElementById('inner'),inp=document.getElementById('inp');
function toggleSide(){side.classList.toggle('open');ov.classList.toggle('show')}
function q(t){inp.value=t;send()}
function detectLang(t){if(/[اآء-ی]/.test(t))return'ur';let w=['kasay','kese','kesy','kya','kia','haal','sunao','batao','ap','aap','theek','hu','hoon'];if(w.some(x=>t.toLowerCase().includes(x)))return'ur';return'en';}
function imgUrl(p){let c=p.replace(/create|picture|image|dp|bana|do/g,'').trim()||'sad boy';let f=encodeURIComponent(c+', whatsapp dp, 4k, aesthetic, portrait');let s=Math.floor(Math.random()*999999);return{u:`https://image.pollinations.ai/prompt/${f}?width=768&height=768&seed=${s}&nologo=true`,c}}
function getReply(t,lang){
 let l=t.toLowerCase();
 if(l.includes('create')||l.includes('dp')||l.includes('picture')||l.includes('sad boy')||l.includes('attitude')||l.includes('bana')||l.includes('generate')){
  let g=imgUrl(t);
  return lang==='en'?{html:`Here's your <b>${g.c}</b> DP 👇<br><img src="${g.u}" class="img" onload="document.getElementById('chat').scrollTop=99999">`,opts:["Hoodie sad boy","Attitude with sunglasses","Alone dark","Anime sad boy"]}:{html:`Ye lo aapki <b>${g.c}</b> DP 👇🔥<br><img src="${g.u}" class="img" onload="document.getElementById('chat').scrollTop=99999">`,opts:["Hoodie wala","Attitude wala","Alone dark","Anime"]};
 }
 if(l.includes('how are you')) return {html: lang==='en'?"I'm doing great, thank you! 😊 How are you?":"I'm doing great! Aap kaise ho? 😊", opts: lang==='en'?["I'm good","I'm sad","Tell a joke"]:["Theek hu","Sad hu","Can we talk?"]};
 if(l.includes('kasay ho')||l.includes('kese ho')||l.includes('kya haal')) return {html:"Mai bilkul theek hu, Alhamdulillah! 💜 Aap sunao?"};
 if(l.includes('salam')) return {html: lang==='en'?"Walaikum Salam! 👋":"Walaikum Salam! 👋 Kese ho?"};
 if(l.includes('sad')||l.includes('udas')) return {html: lang==='en'?"I'm sorry you're feeling sad. I'm here to listen 💜": "Aap sad ho? Mai yahan hu sunne ke liye 💜"};
 if(l.includes('hi')||l.includes('hello')) return {html: lang==='en'?"Hello! I'm Angel AI by Imtiyaz - how can I help?":"Hello! Mai Angel AI hu - bolo kya help chahiye?"};
 return {html: lang==='en'?`Got it! You said "${t}". How can I help with that?`:`Samajh gaya! Aapne "${t}" kaha. Kaise madad karu?`, opts: lang==='en'?["Explain more","Create image"]:["Aur batao","Image banao"]};
}
function add(role,html){let r=document.createElement('div');r.className='row '+role;if(role==='user')r.innerHTML=`<div class="bub">${html.replace(/</g,'&lt;')}</div>`;else r.innerHTML=`<div class="av">👼</div><div class="bub">${html}</div>`;inner.appendChild(r);document.getElementById('chat').scrollTop=999999}
function addOpt(html,opts){let r=document.createElement('div');r.className='row bot';let o=opts?`<div class="opts">${opts.map(x=>`<button class="opt" onclick="q('${x.replace(/'/g,'')}')">${x}</button>`).join('')}</div>`:'';r.innerHTML=`<div class="av">👼</div><div class="bub">${html}${o}</div>`;inner.appendChild(r);document.getElementById('chat').scrollTop=999999}
function send(){let t=inp.value.trim();if(!t)return;let lang=detectLang(t);add('user',t);inp.value='';inp.style.height='auto';document.querySelector('.welcome')?.remove();setTimeout(()=>{let r=getReply(t,lang);if(r.opts)addOpt(r.html,r.opts);else add('bot',r.html)},400)}
inner.innerHTML=`<div class="welcome"><h1>What can I help with?</h1><div class="cards"><div class="card" onclick="q('create sad boy dp')"><b>Create sad boy DP for WhatsApp</b><span>Image generation</span></div><div class="card" onclick="q('how are you')"><b>How are you?</b><span>English chat</span></div><div class="card" onclick="q('kasay ho ap')"><b>Kasay ho ap?</b><span>Urdu chat</span></div><div class="card" onclick="q('I am feeling sad today')"><b>I'm feeling sad today</b><span>Supportive chat</span></div></div><div style="margin-top:40px;color:#666;font-size:12px">↓ Neeche message likho - ab box hamesha dikhega!</div></div>`;
</script>
</body>
</html>
