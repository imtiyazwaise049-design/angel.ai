<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel AI - By Imtiyaz</title>
<meta name="theme-color" content="#212121">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#fff;font-family:system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
.sidebar{width:270px;background:#171717;padding:12px;display:flex;flex-direction:column;transition:0.3s}
.sidebar.hidden{margin-left:-270px}
.main{flex:1;display:flex;flex-direction:column;background:#212121}
.header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a}
.getapp-btn{width:100%;background:#2ecc71;color:#000;font-weight:800;font-size:17px;padding:14px;border-radius:14px;border:none;cursor:pointer}
.center-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.logo{font-size:52px}.app-title{font-size:30px;font-weight:700;margin-top:8px}.ask-title{font-size:28px;font-weight:700;margin:24px 0;text-align:center}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:380px;width:100%}
.chip{background:#2f2f2f;border:1px solid #3a3a3a;padding:16px;border-radius:16px;cursor:pointer;font-size:13px}
.chat-container{flex:1;overflow-y:auto;padding:18px;max-width:800px;margin:0 auto;width:100%;display:none}
.msg{margin-bottom:16px;display:flex;gap:10px}
.msg.user{justify-content:flex-end}
.bubble{max-width:78%;padding:11px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:15px}
.user.bubble{background:#2f2f2f}
.input-area{padding:10px 14px 18px;max-width:800px;margin:0 auto;width:100%}
.input-box{background:#2f2f2f;border-radius:26px;display:flex;align-items:flex-end;padding:6px 8px 6px 14px;gap:6px}
.input-box textarea{background:transparent;border:none;outline:none;color:#fff;flex:1;resize:none;max-height:120px;font-size:15px;padding:10px 0}
.send-btn{background:#2ecc71;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.library-img{width:100%;border-radius:12px;margin-top:8px}
#previewBox{display:none;position:relative;margin-bottom:8px}
#previewBox.show{display:block}
.history-item{padding:9px 10px;border-radius:8px;cursor:pointer;color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item:hover{background:#2f2f2f;color:#fff}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <button onclick="newChat()" style="background:#212121;border:none;color:#fff;padding:11px;border-radius:10px;text-align:left;cursor:pointer;margin-bottom:8px">📝 New Chat</button>
  <div style="padding:6px 0"><button class="getapp-btn" onclick="installApp()">📥 Get The App</button></div>
  <div id="history" style="flex:1;overflow-y:auto"></div>
  <div style="border-top:1px solid #2a2a2a;padding-top:8px">
    <div onclick="showLibrary()" style="padding:10px;cursor:pointer;font-size:14px">📚 Library <span style="color:#666;font-size:10px">(Only Images/Videos)</span></div>
    <div style="padding:10px;display:flex;gap:8px;align-items:center"><span>👼</span><div><div style="font-size:13px">Angel AI</div><div style="font-size:10px;color:#666">By Imtiyaz</div></div></div>
  </div>
</div>
<div class="main">
  <div class="header"><button onclick="toggleSidebar()" style="background:transparent;border:none;color:#fff;font-size:22px">☰</button><div style="font-weight:700">Angel AI</div><div style="width:22px"></div></div>
  <div class="center-area" id="centerArea"><div class="logo">👼</div><div class="app-title">Angel AI</div><div class="ask-title">What can I help with?</div><div class="chips"><div class="chip" onclick="quickAsk(this)">✨ Write a bedtime story</div><div class="chip" onclick="quickAsk(this)">💡 Brainstorm ideas</div><div class="chip" onclick="quickAsk(this)">📝 Summarize notes</div><div class="chip" onclick="quickAsk(this)">🏋️ Workout plan</div></div></div>
  <div class="chat-container" id="chatContainer"></div>
  <div class="input-area"><div id="previewBox"><img id="previewImage" style="width:70px;height:70px;object-fit:cover;border-radius:10px"><button onclick="clearPreview()" style="position:absolute;top:-6px;left:64px;background:#000;border-radius:50%;border:none;color:#fff;width:20px;height:20px">×</button></div><div class="input-box"><button onclick="document.getElementById('fileInput').click()" style="background:transparent;border:none;color:#aaa;font-size:20px">+</button><textarea id="chatInput" placeholder="Ask anything..." rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSend()}"></textarea><button class="send-btn" onclick="handleSend()">↑</button></div></div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" hidden onchange="handleFile(this.files[0])">
<script>
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')alert('✅ Installed!');deferredPrompt=null;}else{alert("Install: 3 dots ⋮ > Add to Home Screen");}}
let chats=JSON.parse(localStorage.getItem('angelChats')||'[]');let library=JSON.parse(localStorage.getItem('angelLibrary')||'[]');
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('hidden');}
function newChat(){document.getElementById('chatContainer').innerHTML='';document.getElementById('chatContainer').style.display='none';document.getElementById('centerArea').style.display='flex';}
function quickAsk(el){document.getElementById('chatInput').value=el.innerText;handleSend();}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function renderHistory(){const h=document.getElementById('history');h.innerHTML='';chats.slice(0,25).forEach(c=>{const d=document.createElement('div');d.className='history-item';d.innerText=c.q;d.onclick=()=>{document.getElementById('chatInput').value=c.q;handleSend();};h.appendChild(d);});}renderHistory();
function addMessage(role,text,img){document.getElementById('centerArea').style.display='none';const cont=document.getElementById('chatContainer');cont.style.display='block';const msg=document.createElement('div');msg.className='msg '+role;let safe=text.replace(/</g,'&lt;');let html=`<div class="bubble">${safe}</div>`;if(img){html=`<div class="bubble"><img src="${img}" class="library-img"><br>${safe}</div>`;}msg.innerHTML=html;cont.appendChild(msg);cont.scrollTop=cont.scrollHeight;return msg;}
function handleFile(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{const src=e.target.result;document.getElementById('previewImage').src=src;document.getElementById('previewBox').classList.add('show');library.unshift({type:file.type.startsWith('video')?'video':'image',src:src,id:Date.now()});localStorage.setItem('angelLibrary',JSON.stringify(library));};reader.readAsDataURL(file);}
function clearPreview(){document.getElementById('previewBox').classList.remove('show');}
async function getAIReply(userText){
  const langPrompt=`You are Angel AI by Imtiyaz. Reply in SAME language as user. English->English, Arabic->Arabic, Hindi->Hindi, Urdu->Urdu. Short friendly. User: ${userText}`;
  try{
    const r=await fetch("https://www.blackbox.ai/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{id:"0",role:"user",content:langPrompt}],conversationId:Date.now().toString()})});
    if(r.ok){let t=await r.text();t=t.replace(/\$\~\~\~\$/g,'').trim();if(t.length>3){try{if(t.trim().startsWith('{')){let j=JSON.parse(t);if(j.response)return j.response;}}catch{}return t;}}
  }catch(e){}
  try{
    const r2=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"user",content:langPrompt}],stream:false})});
    if(r2.ok){const j=await r2.json();if(j.choices&&j.choices[0])return j.choices[0].message.content;}
  }catch(e){}
  const q=userText.toLowerCase().trim();
  if(["hi","hello","hey"].includes(q))return"Hello! 👋 I'm Angel AI by Imtiyaz. How can I help you today?";
  if(q.includes("مرحبا"))return"مرحبا! 👋 أنا Angel AI، كيف يمكنني مساعدتك؟";
  if(q.includes("नमस्ते"))return"नमस्ते! 👋 मैं Angel AI हूँ। कैसे मदद कर सकता हूँ?";
  if(q.includes("سلام"))return"السلام علیکم! 👋 میں Angel AI ہوں، آپ کی کیسے مدد کر سکتا ہوں؟";
  return `You said: "${userText}" - I'm Angel AI by Imtiyaz, here to help!`;
}
