<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angel AI by Imtiyaz</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:58px;background:#0a0a0f;border-bottom:1px solid #1e1e32;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.menu-btn{font-size:22px;cursor:pointer;padding:8px 10px;background:#1a1a2a;border-radius:8px;border:1px solid #2a2a45}.sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#12121f;border-right:1px solid #2a2a45;z-index:100;padding:20px;transition:0.3s;overflow-y:auto}.sidebar.open{left:0}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99;display:none}.overlay.show{display:block}.side-item{padding:14px 12px;border-radius:10px;margin:6px 0;cursor:pointer;background:#1a1a2e;border:1px solid #2a2a45;font-size:14px}.getapp{border:1.5px solid #a86bff;color:#fff;padding:8px 18px;border-radius:22px;background:transparent;font-size:13px;font-weight:700}.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:10px;max-width:92%}.row.user{align-self:flex-end}.bub{padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.6;white-space:pre-wrap}.user .bub{background:#2d2d4a;border-bottom-right-radius:6px}.bot .bub{background:#15151f;border:1px solid #25253a;border-bottom-left-radius:6px}.opts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}.opt{background:#1c1c2e;border:1px solid #3a3a5e;color:#c9b3ff;padding:7px 13px;border-radius:20px;font-size:12px;cursor:pointer}.img{width:100%;max-width:340px;border-radius:14px;margin-top:10px;border:1px solid #2a2a4a}.input{padding:10px 14px;background:#0a0a0f;border-top:1px solid #1e1e32}.box{background:#181825;border:1.5px solid #2a2a45;border-radius:28px;display:flex;align-items:center;padding:6px 8px 6px 16px;gap:10px}.box textarea{background:transparent;border:0;color:#fff;flex:1;outline:none;resize:none;font-size:15px;padding:9px 0}.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#a86bff);border:0;color:#fff;font-size:18px}</style></head><body>
<div class="overlay" id="ov" onclick="toggleMenu()"></div>
<div class="sidebar" id="side">
<h2 style="margin-bottom:20px;background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">angel.ai</h2>
<div class="side-item" onclick="toggleMenu();document.getElementById('inp').value='create sad boy dp';send()">✨ Create Image</div>
<div class="side-item" onclick="toggleMenu();alert('Gallery: Only images/videos - 100% Family Friendly!')">🖼️ Gallery - Images Only</div>
<div class="side-item" onclick="toggleMenu();alert('Angel AI by Imtiyaz - Family Friendly Assistant, No adult content!')">ℹ️ About Angel AI</div>
<div class="side-item" onclick="toggleMenu();alert('📥 Install: Browser ke 3 dots ⋮ > Add to Home Screen > Install')">📲 Get App / Install</div>
<div class="side-item" onclick="toggleMenu();alert('Contact: imtiyazwaise049@gmail.com')">📧 Contact</div>
<div style="margin-top:20px;padding:12px;background:#1a1a2e;border-radius:10px;font-size:12px;color:#888">By Imtiyaz<br>Family-Friendly • Clean • Safe</div>
</div>
<div class="topbar"><div style="display:flex;align-items:center;gap:12px"><span class="menu-btn" onclick="toggleMenu()">☰</span><span class="logo">angel.ai</span><span style="font-size:10px;color:#555">by Imtiyaz</span></div><button class="getapp" onclick="toggleMenu()">Get App</button></div>
<div class="chat" id="chat"></div>
<div class="input"><div class="box"><textarea id="inp" placeholder="Ask anything or create image..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()">↑</button></div></div>
<script>
let chat=document.getElementById('chat');
function toggleMenu(){document.getElementById('side').classList.toggle('open');document.getElementById('ov').classList.toggle('show');}
function add(role,html){let r=document.createElement('div');r.className='row '+role;r.innerHTML=role==='user'?`<div class="bub">${html}</div>`: `<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#a86bff);display:flex;align-items:center;justify-content:center">👼</div><div class="bub">${html}</div>`;chat.appendChild(r);chat.scrollTop=chat.scrollHeight;}
function addOpt(t,o){let oh=`<div class="opts">`+o.map(x=>`<button class="opt" onclick="document.getElementById('inp').value='${x}';send()">${x}</button>`).join('')+`</div>`;add('bot',t+oh);}
function imgUrl(p){let c=p.replace(/can you|please|create|picture|image|dp|for me|my/g,'').trim()||'sad boy';let f=encodeURIComponent(c+', whatsapp dp, aesthetic, 4k');return {u:`https://image.pollinations.ai/prompt/${f}?width=768&height=768&seed=${Math.floor(Math.random()*9999)}&nologo=true`,c};}
function reply(q){let l=q.toLowerCase();if(l.includes('create')||l.includes('dp')||l.includes('picture')||l.includes('image')||l.includes('photo')||l.includes('sad boy')||l.includes('attitude')||l.includes('colorful')||l.includes('filter')){let g=imgUrl(q);return {h:`Here is your <b>${g.c}</b> DP! 👇🔥<br><img src="${g.u}" class="img"><br><br>💜 Kaisa laga? Ye aapki bheji hui colorful filter jaisa bhi bana sakta hu!`,o:["Hoodie wala","Attitude with sunglasses","Colorful triple exposure filter","Anime sad boy"]}if(l.includes('kasay ho')||l.includes('kese ho')||l.includes('how are you')){return {h:"Mai bilkul theek hu! Alhamdulillah 💜 Aap sunao, aap kese ho?"}}if(l.includes('hi')||l==='hello'){return {h:"Hello! 👋 I am Angel AI by Imtiyaz. How can I help you today?"}}if(l.includes('sad')){return {h:"I'm sorry you're feeling sad 😔 You are not alone. I'm here for you."}}return {h:`Aapne kaha: "${q}" 😊 Batao kya help chahiye?`}}
function send(){let i=document.getElementById('inp');let q=i.value.trim();if(!q)return;add('user',q.replace(/</g,'&lt;'));i.value='';setTimeout(()=>{let r=reply(q);if(r.o)addOpt(r.h,r.o);else add('bot',r.h)},500);}
add('bot',"Hello! 👋 I am <b>Angel AI by Imtiyaz</b><br><br>✅ Ab 3 dot (☰) click hoga!<br>✅ Family-friendly<br>✅ Create DPs<br><br>Try: 'create sad boy dp'");
</script></body></html>
