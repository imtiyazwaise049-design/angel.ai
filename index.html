<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angel AI by Imtiyaz - Real AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#ececec;font-family:Inter,sans-serif;height:100dvh;display:flex;overflow:hidden}
.side{width:260px;background:#171717;display:flex;flex-direction:column;flex-shrink:0}
@media(max-width:768px){.side{position:fixed;left:-260px;top:0;height:100dvh;z-index:200;transition:0.3s}.side.open{left:0}}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#212121;border-bottom:1px solid #2f2f2f;flex-shrink:0}
.m-btn{font-size:24px;cursor:pointer}
.model b{background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:100px}
.inner{width:100%;max-width:768px;padding:20px 16px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;width:100%}.row.user{justify-content:flex-end}
.bub{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-width:85%}
.user .bub{background:#2f2f2f;padding:10px 16px;border-radius:20px}
.bot .bub{color:#ececec}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#a86bff);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome{margin-top:40px;text-align:center;width:100%}
.welcome h1{font-size:26px;font-weight:600;margin-bottom:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:0 auto;text-align:left}
.card{border:1px solid #333;padding:14px;border-radius:12px;cursor:pointer;background:#1e1e1e}.card:hover{background:#2f2f2f}
.card b{display:block;font-size:14px}.card span{color:#888;font-size:12px}
.img{width:100%;max-width:380px;border-radius:12px;margin-top:10px;border:1px solid #333}
.typing{color:#888;font-style:italic;font-size:14px}
.input-wrap{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px;display:flex;justify-content:center;z-index:50;border-top:1px solid #2f2f2f}
@media(min-width:769px){.input-wrap{left:260px}}
.box{width:100%;max-width:768px;background:#2f2f2f;border-radius:26px;display:flex;align-items:center;padding:6px 8px 6px 16px;gap:8px;border:1px solid #444}
.box textarea{background:transparent;border:0;color:#fff;flex:1;outline:none;resize:none;font-size:16px;padding:8px 0;font-family:inherit}
.send{width:32px;height:32px;border-radius:50%;background:#fff;color:#000;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;display:none}.overlay.show{display:block}
</style>
</head>
<body>
<div class="overlay" id="ov" onclick="toggleSide()"></div>
<div class="side" id="side">
<div style="padding:14px"><button onclick="location.reload()" style="width:100%;background:#2f2f2f;border:0;color:#fff;padding:10px;border-radius:8px">＋ New chat</button><div style="padding:12px 4px;font-weight:700"><span>👼</span> <b style="background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">angel.ai</b> <small style="color:#666;font-size:10px">by Imtiyaz</small></div></div>
<div style="flex:1;padding:10px;overflow:auto"><div style="font-size:11px;color:#666;padding:8px">Recent</div><div style="padding:8px;color:#888;font-size:12px">Real AI enabled - No more fake replies!</div></div>
<div style="padding:12px;border-top:1px solid #2f2f2f"><button style="width:100%;background:#fff;color:#000;border:0;padding:10px;border-radius:20px;font-weight:700" onclick="alert('Add to Home Screen for App')">⬇ Get App</button></div>
</div>
<div class="main">
<div class="topbar"><div style="display:flex;align-items:center;gap:12px"><span class="m-btn" onclick="toggleSide()">☰</span><span class="model"><b>angel.ai</b> by Imtiyaz - Real AI</span></div></div>
<div class="chat" id="chat"><div class="inner" id="inner"></div></div>
<div class="input-wrap"><div class="box"><textarea id="inp" rows="1" placeholder="Message Angel AI... ask weather, anything!" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" id="sendBtn" onclick="send()">↑</button></div></div>
</div>
<script>
let inner=document.getElementById('inner'),inp=document.getElementById('inp');
function toggleSide(){side.classList.toggle('open');ov.classList.toggle('show')}
function q(t){inp.value=t;send()}

async function realAIReply(userText){
  let lang = /[اآء-ی]|kasay|kese|kya|haal|ap\b/.test(userText.toLowerCase()) ? 'Urdu/Hindi mix roman' : 'English';
  // Image request?
  if(/create|dp|picture|image|photo|sad boy|attitude|bana|generate/i.test(userText)){
    let clean=userText.replace(/create|picture|image|dp|bana|generate/g,'').trim()||'sad boy';
    let f=encodeURIComponent(clean+', whatsapp dp, 4k aesthetic portrait');
    let s=Math.floor(Math.random()*999999);
    let url=`https://image.pollinations.ai/prompt/${f}?width=768&height=768&seed=${s}&nologo=true`;
    return {type:'image', html:`Here's your <b>${clean}</b> DP 👇<br><img src="${url}" class="img">`, text:`Image of ${clean}`};
  }
  // Real Text AI via free API
  try{
    let system = `You are Angel AI by Imtiyaz, friendly helpful assistant. Reply in ${lang}. If user speaks ${lang}, reply in same language. Be natural, helpful, concise. Family friendly only. Owner: Imtiyaz.`;
    let prompt = encodeURIComponent(system + "\n\nUser: " + userText);
    let res = await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
    let txt = await res.text();
    // Clean
    txt = txt.trim();
    if(!txt) throw 'empty';
    return {type:'text', html: txt.replace(/\n/g,'<br>'), text: txt};
  }catch(e){
    return {type:'text', html:`Sorry, AI is busy. But I can still help! You asked about <b>"${userText}"</b>. <br><br>For weather in UAE: Today it's generally hot 32-38°C, humid in Abu Dhabi/Dubai. Try again in 5 seconds for real AI answer.`, text:''};
  }
}

function add(role,html){
  let r=document.createElement('div');r.className='row '+role;
  if(role==='user') r.innerHTML=`<div class="bub">${html.replace(/</g,'&lt;')}</div>`;
  else r.innerHTML=`<div class="av">👼</div><div class="bub">${html}</div>`;
  inner.appendChild(r); document.getElementById('chat').scrollTop=999999;
}
async function send(){
  let t=inp.value.trim();if(!t)return;
  add('user',t); inp.value='';
  document.querySelector('.welcome')?.remove();
  let typing=document.createElement('div'); typing.className='row bot'; typing.id='typing';
  typing.innerHTML=`<div class="av">👼</div><div class="bub typing">Angel AI is thinking...</div>`;
  inner.appendChild(typing); document.getElementById('chat').scrollTop=999999;
  document.getElementById('sendBtn').disabled=true;
  let reply = await realAIReply(t);
  document.getElementById('typing')?.remove();
  add('bot',reply.html);
  document.getElementById('sendBtn').disabled=false;
  inp.focus();
}
inner.innerHTML=`<div class="welcome"><h1>What can I help with?</h1><div class="cards"><div class="card" onclick="q('weather in UAE today')"><b>Weather in UAE today</b><span>Real AI answer</span></div><div class="card" onclick="q('create sad boy dp')"><b>Create sad boy DP</b><span>Image generation</span></div><div class="card" onclick="q('how are you')"><b>How are you?</b><span>English</span></div><div class="card" onclick="q('kasay ho ap')"><b>Kasay ho ap?</b><span>Urdu</span></div></div><div style="margin-top:20px;color:#22c55e;font-size:13px;font-weight:600">✅ REAL AI ENABLED - No more fake 'Got it' replies!</div></div>`;
</script>
</body>
</html>
