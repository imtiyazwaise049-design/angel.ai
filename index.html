<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angel AI by Imtiyaz</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:56px;background:#0a0a0f;border-bottom:1px solid #1a1a25;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,#ff6ec7,#a86bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}.chat-view{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.msg{display:flex;gap:10px;max-width:88%}.msg.user{align-self:flex-end}.bub{padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.user .bub{background:#2a2a40;border-bottom-right-radius:4px}.bot .bub{background:#181825;border:1px solid #222233;border-bottom-left-radius:4px}.input-wrap{padding:10px 12px 14px;background:#0a0a0f;border-top:1px solid #1a1a25}.input-box{background:#181825;border:1px solid #2a2a3f;border-radius:26px;display:flex;align-items:center;padding:6px 8px 6px 14px;gap:8px}.input-box textarea{background:transparent;border:0;color:#fff;flex:1;outline:none;resize:none;font-size:15px;padding:8px 0;max-height:90px}.send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff6ec7,#a86bff);border:0;color:#fff;font-size:18px;cursor:pointer}.bottom-nav{height:64px;background:#0f0f18;border-top:1px solid #1a1a25;display:flex;justify-content:space-around;align-items:center}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#666;font-size:10px;cursor:pointer}.nav-item.active{color:#ff6ec7}.nav-item span{font-size:20px}</style></head><body>
<div class="topbar"><div style="display:flex;gap:10px;align-items:center"><span>☰</span><span class="logo">angel.ai</span><span style="font-size:10px;color:#555">by Imtiyaz</span></div><button style="border:1px solid #a86bff;background:transparent;color:#fff;padding:6px 14px;border-radius:20px" onclick="alert('Install: 3 dots > Add to Home Screen')">Get App</button></div>
<div class="chat-view" id="chat"></div>
<div class="input-wrap"><div class="input-box"><textarea id="inp" placeholder="Ask anything..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()">↑</button></div></div>
<div class="bottom-nav"><div class="nav-item active"><span>🔍</span>Explore</div><div class="nav-item"><span>💬</span>Chat</div><div class="nav-item"><span>🖼️</span>Gallery</div><div class="nav-item"><span>👤</span>Profile</div></div>
<script>
let chat=document.getElementById('chat');
function add(role,t){let m=document.createElement('div');m.className='msg '+role;let safe=t.replace(/</g,'&lt;');m.innerHTML=`<div class="bub">${safe}</div>`;chat.appendChild(m);chat.scrollTop=chat.scrollHeight}
function smartReply(q){
  let l=q.toLowerCase().trim();
  if(['hi','hello','hey','salam','assalam','as-salam'].some(w=>l===w||l.startsWith(w+' '))) return "Hello! 👋 I'm Angel AI by Imtiyaz. How can I help you today? 😊";
  if(l.includes('how are you')) return "I'm doing really well, thank you for asking! 💜 I'm Angel AI, always ready to help and chat with you. How are YOU doing? Tell me honestly.";
  if(l.includes('can we talk') || l.includes('talk to me') || l.includes('need to talk')) return "Yes, absolutely! 💜 I'm all ears. You can talk to me about anything - I'm here to listen, no judgment at all. What's on your mind?";
  if(l.includes('sad') || l.includes('depressed') || l.includes('low') || l.includes('upset') || l.includes('cry')) return "I'm so sorry you're feeling this way 😔 It's okay to feel sad, everyone does sometimes. You are not alone.\n\nDo you want to share what happened? If not, I can distract you - I can tell you a funny story, suggest some music, or just sit here with you virtually. What would help you feel a little better right now?";
  if(l.includes('bored')) return "Bored? Let's fix that! 😄 I have ideas:\n1. Tell you a bedtime story?\n2. Play 20 questions?\n3. Brainstorm your next project?\n4. Write a poem for you?\nWhat do you want to do?";
  if(l.includes('love you')) return "Aww, that's so sweet! Love you too! 💜 You're an amazing person. How can I make your day better?";
  if(l.includes('who are you') || l.includes('what is your name')) return "I'm Angel AI 👼 - Your friendly AI assistant made by Imtiyaz. I can chat, write stories, give ideas, help with studies, and be your friend!";
  if(l.includes('thank')) return "You're most welcome! 😊 Anytime you need me, I'm here. Anything else I can do for you?";
  if(l.includes('joke')) return "Okay, here's one: Why did the phone go to therapy? Because it lost all its contacts! 😂 Want another one?";
  // default smart
  return `Got it - you said: "${q}"\n\nThat's interesting! Tell me more about that? I can help you think deeper, give ideas, or just chat about it. What do you want to do next?`;
}
function send(){
  let i=document.getElementById('inp'); let q=i.value.trim(); if(!q) return;
  add('user',q); i.value='';
  setTimeout(()=>{
    let ans=smartReply(q);
    add('bot',ans);
  },400);
}
add('bot',"Hello! 👋 I am Angel AI by Imtiyaz.\n\nHow can I help you today? You can say 'I am sad', 'can we talk', 'tell me a joke' - I will reply differently every time!");
</script></body></html>
