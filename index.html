<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel AI - Ultimate</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:sans-serif;background:#0f0f0f;color:white} .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}</style>
</head>
<body class="min-h-screen">
  <header class="p-4 flex justify-between items-center border-b border-gray-800">
    <h1 class="font-bold text-xl">👼 Angel AI</h1>
    <button id="libraryBtn" class="glass px-4 py-2 rounded-full">📚 Library</button>
  </header>
  <div class="max-w-4xl mx-auto p-4">
    <div class="glass rounded-2xl p-4 mb-4">
      <div class="flex gap-2">
        <input id="chatInput" placeholder="Ask anything..." class="flex-1 bg-black border border-gray-700 p-3 rounded-full outline-none">
        <button id="sendBtn" class="bg-white text-black px-6 py-3 rounded-full font-bold">Send</button>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="glass rounded-2xl p-4 text-center">
        <h3 class="font-bold mb-3">📸 Image to Image</h3>
        <input type="file" id="imageUpload" accept="image/*" class="hidden">
        <button onclick="document.getElementById('imageUpload').click()" class="w-full bg-purple-600 py-2 rounded-full">Choose Photo</button>
        <input id="imagePrompt" placeholder="What to create? (e.g. cartoon)" class="w-full bg-black border border-gray-700 p-2 rounded-full mt-2 text-sm outline-none">
        <button id="generateImageBtn" class="w-full bg-pink-600 py-2 rounded-full mt-2 text-sm font-bold">✨ Generate & Save to Library</button>
      </div>
      <div class="glass rounded-2xl p-4">
        <h3 class="font-bold mb-2">Result:</h3>
        <img id="previewImage" class="w-full rounded-xl hidden mb-2">
        <div id="chatResponse" class="text-sm text-gray-300">Answer will appear here...</div>
        <button id="downloadBtn" class="hidden w-full mt-3 bg-green-600 py-2 rounded-full text-sm">⬇️ Download Image</button>
      </div>
    </div>
  </div>

<div id="libraryModal" class="fixed inset-0 bg-black/90 hidden z-50 p-4 overflow-auto">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">📚 Your Library</h2>
      <button id="closeLibrary" class="glass px-4 py-2 rounded-full">X Close</button>
    </div>
    <div id="libraryGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </div>
</div>

<script>
let library = JSON.parse(localStorage.getItem('angelLibrary') || '[]');

document.getElementById('sendBtn').onclick = async ()=>{
  const q = document.getElementById('chatInput').value;
  if(!q) return;
  document.getElementById('chatResponse').innerText = "Thinking...";
  try{
    const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&pretty=1`);
    const data = await res.json();
    let ans = data.AbstractText || data.RelatedTopics?.[0]?.Text || "Angel AI Answer: " + q;
    document.getElementById('chatResponse').innerText = ans;
    library.unshift({type:'chat', question:q, answer:ans, id:Date.now()});
    localStorage.setItem('angelLibrary', JSON.stringify(library));
  }catch(e){
    document.getElementById('chatResponse').innerText = "Angel AI: " + q + " - This is a great question! I am here to help you.";
  }
};

document.getElementById('imageUpload').onchange = (e)=>{
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = (ev)=>{
      document.getElementById('previewImage').src = ev.target.result; 
      document.getElementById('previewImage').classList.remove('hidden');
      document.getElementById('downloadBtn').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }
};

document.getElementById('generateImageBtn').onclick = ()=>{
  const prompt = document.getElementById('imagePrompt').value;
  const imgSrc = document.getElementById('previewImage').src;
  if(!imgSrc){alert('Choose photo first');return}
  library.unshift({type:'image', prompt:prompt, image: imgSrc, id:Date.now()});
  localStorage.setItem('angelLibrary', JSON.stringify(library));
  alert('📚 Saved to Library!');
  loadLibrary();
};

document.getElementById('downloadBtn').onclick = ()=>{
  const img = document.getElementById('previewImage').src;
  const a = document.createElement('a'); a.href = img; a.download = 'angel-ai-image.png'; a.click();
};

function loadLibrary(){
  const grid = document.getElementById('libraryGrid');
  grid.innerHTML = "";
  library.forEach(item=>{
    if(item.type=='image'){
      grid.innerHTML += `<div class="glass rounded-xl p-2"><img src="${item.image}" class="w-full rounded-lg"><p class="text-xs mt-1">${item.prompt||''}</p><a href="${item.image}" download="angel-${item.id}.png" class="text-xs text-green-400">⬇️ Download</a></div>`;
    } else {
      grid.innerHTML += `<div class="glass rounded-xl p-3"><p class="text-xs font-bold">Q: ${item.question}</p><p class="text-xs text-gray-400 mt-1">${item.answer?.substring(0,100)}...</p></div>`;
    }
  });
}
document.getElementById('libraryBtn').onclick = ()=>{document.getElementById('libraryModal').classList.remove('hidden'); loadLibrary();};
document.getElementById('closeLibrary').onclick = ()=>document.getElementById('libraryModal').classList.add('hidden');
</script>
</body>
</html>
