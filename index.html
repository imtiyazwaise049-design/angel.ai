<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel AI - By Imtiyaz</title>
<meta name="theme-color" content="#212121">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#212121;color:#fff;font-family:Inter,system-ui,sans-serif;height:100vh;display:flex;overflow:hidden}
.sidebar{width:260px;background:#171717;padding:12px;display:flex;flex-direction:column;transition:0.3s;z-index:50}
.sidebar.hidden{margin-left:-260px}
.main{flex:1;display:flex;flex-direction:column;background:#212121;position:relative}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center}
.demo-top{padding:12px}
.getapp-btn{width:100%;background:#2ecc71;color:#000;font-weight:800;font-size:18px;padding:16px;border-radius:16px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.center-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.logo{font-size:48px}
.app-title{font-size:32px;font-weight:700;margin-top:10px}
.ask-title{font-size:32px;font-weight:700;margin:28px 0;text-align:center}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:400px;width:100%}
.chip{background:#2f2f2f;border:1px solid #444;padding:18px;border-radius:18px;cursor:pointer;font-size:14px}
.chat-container{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%;display:none}
.msg{margin-bottom:18px;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.bubble{max-width:75%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.user.bubble{background:#2f2f2f}
.input-area{padding:12px 16px 20px;max-width:800px;margin:0 auto;width:100%}
.input-box{background:#2f2f2f;border-radius:28px;display:flex;align-items:flex-end;padding:8px 8px 8px 16px;gap:8px}
.input-box textarea{background:transparent;border:none;outline:none;color:#fff;flex:1;resize:none;max-height:120px;font-size:16px;padding:10px 0}
.icon-btn{background:transparent;border:none;color:#aaa;font-size:22px;cursor:pointer;padding:8px}
.send-btn{background:#2ecc71;color:#000;border:none;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.library-img{width:100%;border-radius:12px;margin-top:8px}
#previewBox{display:none;position:relative;margin-bottom:8px}
#previewBox.show{display:block}
.history-item{padding:10px;border-radius:8px;cursor:pointer;color:#aaa;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item:hover{background:#2f2f2f;color:#fff}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <button onclick="newChat()" style="background:#212121;border:none;color:#fff;padding:12px;border-radius:10px;text-align:left;cursor:pointer;margin-bottom:10px">📝 New Chat</button>
  <div class="demo-top"><button class="getapp-btn" onclick="installApp()">📥 Get The App</button></div>
  <div style="margin-top:10px;color:#666;font-size:12px;padding:8px">Recent</div>
  <div id="history" style="flex:1;overflow-y:auto"></div>
  <div style="border-top:1px solid #333;padding-top:10px">
    <div onclick="showLibrary()" style="padding:10px;cursor:pointer">📚 Library <span style="color:#666;font-size:11px">(Only Images/Videos)</span></div>
    <div style="padding:10px;display:flex;gap:8px;align-items:center"><span>👼</span><div><div style="font-size:14px">Angel AI</div><div style="font-size:11px;color:#888">By Imtiyaz</div></div></div>
  </div>
</div>
<div class="main">
  <div class="header">
    <button onclick="toggleSidebar()" style="background:transparent;border:none;color:#fff;font-size:22px">☰</button>
    <div style="font-weight:600">Angel AI</div>
    <div style="width:22px"></div>
  </div>
  <div class="center-area" id="centerArea">
    <div class="logo">👼</div>
    <div class="app-title">Angel AI</div>
    <div class="ask-title">What can I help with?</div>
    <div class="chips">
      <div class="chip" onclick="quickAsk(this)">✨ Write a bedtime story</div>
      <div class="chip" onclick="quickAsk(this)">💡 Brainstorm creative ideas</div>
      <div class="chip" onclick="quickAsk(this)">📝 Summarize my notes</div>
      <div class="chip" onclick="quickAsk(this)">🏋️ Plan a weekly workout</div>
    </div>
  </div>
  <div class="chat-container" id="chatContainer"></div>
  <div class="input-area">
    <div id="previewBox"><img id="previewImage" style="width:80px;height:80px;object-fit:cover;border-radius:10px"><button onclick="clearPreview()" style="position:absolute;top:-6px;left:74px;background:#000;border-radius:50%;border:none;color:#fff;width:22px;height:22px">×</button></div>
    <div class="input-box">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()">+</button>
      <textarea id="chatInput" placeholder="Ask anything..." rows="1" oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSend()}"></textarea>
      <button class="icon-btn">🎤</button>
      <button class="send-btn" onclick="handleSend()">↑</button>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*" hidden onchange="handleFile(this.files[0])">
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt=e; });
async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted'){ alert('✅ Angel AI Installed!'); }
    deferredPrompt=null;
  }else{
    alert("To Install:\n1. Click 3 dots ⋮\n2. Add to Home Screen\n3. Install");
  }
}
let chats = JSON.parse(localStorage.getItem('angelChats')||'[]');
let library = JSON.parse(localStorage.getItem('angelLibrary')||'[]');
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
function newChat(){ document.getElementById('chatContainer').innerHTML=''; document.getElementById('chatContainer').style.display='none'; document.getElementById('centerArea').style.display='flex'; }
function quickAsk(el){ document.getElementById('chatInput').value=el.innerText; handleSend(); }
function autoGrow(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; }
function renderHistory(){
  const h=document.getElementById('history'); h.innerHTML='';
  chats.slice(0,20).forEach(c=>{ const d=document.createElement('div'); d.className='history-item'; d.innerText=c.q; d.onclick=()=>{document.getElementById('chatInput').value=c.q; handleSend();}; h.appendChild(d); });
}
renderHistory();
function addMessage(role,text,img){
  document.getElementById('centerArea').style.display='none';
  const cont=document.getElementById('chatContainer'); cont.style.display='block';
  const msg=document.createElement('div'); msg.className='msg '+role;
  let html = `<div class="bubble">${text.replace(/</g,'&lt;')}</div>`;
  if(img){ html = `<div class="bubble"><img src="${img}" class="library-img"><br>${text.replace(/</g,'&lt;')}</div>`; }
  msg.innerHTML=html; cont.appendChild(msg); cont.scrollTop=cont.scrollHeight;
}
function handleFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const src=e.target.result;
    document.getElementById('previewImage').src=src;
    document.getElementById('previewBox').classList.add('show');
    library.unshift({type: file.type.startsWith('video')?'video':'image', src: src, id: Date.now()});
    localStorage.setItem('angelLibrary', JSON.stringify(library));
  };
  reader.readAsDataURL(file);
}
function clearPreview(){ document.getElementById('previewBox').classList.remove('show'); }
async function handleSend(){
  const input=document.getElementById('chatInput');
  const q=input.value.trim(); if(!q) return;
  const imgEl=document.getElementById('previewImage');
  const hasImg=document.getElementById('previewBox').classList.contains('show') && imgEl.src;
  const imgSrc=hasImg?imgEl.src:null;
  addMessage('user', q, imgSrc);
  input.value=''; clearPreview();
  chats.unshift({q, time:Date.now()}); localStorage.setItem('angelChats', JSON.stringify(chats)); renderHistory();
  addMessage('assistant','Thinking... ✨');
  const chatCont=document.getElementById('chatContainer');
  try{
    const prompt = `You are Angel AI by Imtiyaz. Reply in SAME language as user input. If English then English, Arabic then Arabic, Hindi then Hindi, Urdu then Urdu. Keep short helpful like ChatGPT. User: ${q}`;
    const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
    let answer=await res.text();
    chatCont.lastChild.remove();
    addMessage('assistant', answer);
  }catch(e){
    chatCont.lastChild.remove();
    addMessage('assistant', q.toLowerCase()==='hi'? "Hello! 👋 I'm Angel AI. How can I help you today?" : `You said: "${q}" - I'm here to help!`);
  }
}
function showLibrary(){
  document.getElementById('centerArea').style.display='none';
  const cont=document.getElementById('chatContainer'); cont.style.display='block'; cont.innerHTML='<h3>📚 Library - Images/Videos Only</h3><br>';
  if(library.length===0){ cont.innerHTML+='<p style="color:#888">No media yet.</p>'; return; }
  library.forEach(item=>{
    const d=document.createElement('div'); d.style.marginBottom='16px';
    if(item.type==='image') d.innerHTML=`<img src="${item.src}" class="library-img">`;
    else d.innerHTML=`<video src="${item.src}" controls class="library-img"></video>`;
    cont.appendChild(d);
  });
}
</script>
</body>
</html>
