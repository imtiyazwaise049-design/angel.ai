<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angel AI</title><style>body{margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #222}.logo{font-weight:900;color:#ff6ec7;font-size:20px}#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 16px;border-radius:18px;max-width:85%;font-size:14px}.user{align-self:flex-end;background:#2d2d4a}.bot{align-self:flex-start;background:#1a1a2e;border:1px solid #2a2a45}.input{display:flex;gap:8px;padding:12px;border-top:1px solid #222}.input input{flex:1;background:#181825;border:1px solid #2a2a45;border-radius:24px;padding:12px 16px;color:#fff;outline:none}.input button{background:#a86bff;border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px}</style></head><body>
<div class="top"><b class="logo">angel.ai</b><small>by Imtiyaz</small></div>
<div id="chat"></div>
<div class="input"><input id="inp" placeholder="Kasay ho ap likho ya create dp..."><button onclick="send()">↑</button></div>
<script>
let chat=document.getElementById('chat');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=99999;}
function reply(q){
 let l=q.toLowerCase();
 if(l.includes('create')||l.includes('dp')||l.includes('image')||l.includes('photo')||l.includes('sad boy')||l.includes('attitude')){
  let s=Math.floor(Math.random()*9999);
  let p=encodeURIComponent(q+', whatsapp dp, 4k');
  return `Here is your DP 👇<br><img src="https://image.pollinations.ai/prompt/${p}?width=512&height=512&seed=${s}" style="width:100%;max-width:300px;border-radius:12px;margin-top:8px">`;
 }
 if(l.includes('kasay ho')||l.includes('kese ho')||l.includes('how are you')||l.includes('kya haal')) return "Mai bilkul theek hu! Alhamdulillah 💜 Aap sunao aap kese ho? 😊";
 if(l.includes('salam')) return "Walaikum Salam! 👋";
 if(l.includes('hi')||l.includes('hello')) return "Hello! I am Angel AI by Imtiyaz 💜";
 if(l.includes('sad')) return "I'm here for you 😔 Dil ki baat karo?";
 return `Aapne kaha: "${q}" - batao kya help chahiye?`;
}
function send(){
 let i=document.getElementById('inp');let q=i.value.trim();if(!q)return;
 add(q,'user');i.value='';
 setTimeout(()=>{add(reply(q),'bot')},600);
}
add("Hello! Mai Angel AI hu by Imtiyaz 💜<br><br>Try: <b>kasay ho ap</b> ya <b>create sad boy dp</b>","bot");
</script></body></html>
